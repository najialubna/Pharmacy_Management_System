<h2>Sales Management</h2>



<form id="salesForm">


<input 
type="text" 
id="customer"
placeholder="Customer Name"
required>

<br><br>

<select id="saleMedicine" required>

    <option value="">Select Medicine</option>

</select>


<br><br>


<input 
type="number" 
id="saleQuantity"
placeholder="Quantity"
required>

<br><br>


<input 
type="number" 
id="salePrice"
placeholder="Price"
required>


<br><br>


<button type="submit">
Add Sale
</button>


</form>

<br><br>

<h2>Sales Records</h2>


<table>

<tr>

<th>Invoice No</th>

<th>Customer</th>

<th>Medicine</th>

<th>Quantity</th>

<th>Total Price</th>

</tr>
